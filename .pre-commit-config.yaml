# Local checks before each commit (issue #67). Install once:
#   pip install pre-commit && pre-commit install
# Run on everything: pre-commit run --all-files
# Versions are pinned; `pre-commit autoupdate` bumps them in a reviewed PR.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      # ruff-format joins once the formatting baseline lands (#64): today
      # ruff 0.17.2 would reformat 7 files, which belongs in that PR.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/
      - id: trailing-whitespace
        exclude: ^tests/fixtures/
