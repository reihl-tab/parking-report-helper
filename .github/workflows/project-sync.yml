name: Propose project board changes

# Proposal only: reads the owner's project board
# (users/reihlinstinct/projects/6) and logs which Status/Priority values a
# label or state change on an issue would set. It never writes to the board.
# Manual board edits win (compare-and-set); the curated Queue field is never
# proposed. Mapping: .github/project-sync.json; design: docs/PROJECT-SYNC.md.
#
# Trust boundary: `issues` events always run this file and the checked-out
# code from the default branch, so no pull-request code runs with
# PROJECT_PAT. Do not add pull_request, pull_request_target or workflow_run
# triggers here; tests/test_project_sync.py enforces this.
on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]

permissions: {}

concurrency:
  group: project-sync-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/project_sync.py
            .github/project-sync.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Propose board changes (read-only)
        env:
          PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
        run: python scripts/project_sync.py
