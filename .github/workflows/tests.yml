name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install ".[api]"
      - name: Run unit and CLI tests
        run: python scripts/ci_test_report.py run --start tests --output test-results.json

      - name: Publish test summary
        if: ${{ always() }}
        run: python scripts/ci_test_report.py summary --metrics test-results.json

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install ".[api]" coverage
      - name: Measure coverage
        run: |
          status=0
          python -m coverage run --branch --source=src/parking_report scripts/ci_test_report.py run --start tests --output test-results.json || status=$?
          python -m coverage json -o coverage.json
          python -m coverage report --format=markdown > coverage.md
          python -m coverage html
          python -m coverage report | tail -1
          exit "$status"
      - name: Publish test summary
        if: ${{ always() }}
        run: python scripts/ci_test_report.py summary --metrics test-results.json --coverage coverage.json
      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            coverage.md
            htmlcov/
          retention-days: 30
      - name: Ratchet gate (enabled when repo variable COVERAGE_GATE=on)
        if: vars.COVERAGE_GATE == 'on'
        run: |
          floor=$(cat .github/coverage-floor.txt)
          python -m coverage report | tail -1
          python -m coverage report --fail-under="$floor"

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install ".[api]" "mypy>=1.13,<2"
      - name: mypy (blocking when repo variable MYPY_GATE=on)
        env:
          MYPY_GATE: ${{ vars.MYPY_GATE }}
        run: |
          status=0
          python -m mypy || status=$?
          if [ "$status" -ne 0 ] && [ "$MYPY_GATE" != "on" ]; then
            echo "::warning::mypy reported errors; report-only until MYPY_GATE=on (issue #65)"
            exit 0
          fi
          exit "$status"

  ruff:
    # Issue #64: ruff lint + format check. Report-only until the repo variable
    # RUFF_GATE=on (planned for November), the same pattern as MYPY_GATE.
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install ruff (pinned)
        run: python -m pip install "ruff==0.16.9"
      - name: ruff check and format check (blocking when repo variable RUFF_GATE=on)
        env:
          RUFF_GATE: ${{ vars.RUFF_GATE }}
        run: |
          status=0
          ruff check --output-format=github . || status=1
          ruff format --check . || status=1
          if [ "$status" -ne 0 ] && [ "$RUFF_GATE" != "on" ]; then
            echo "::warning::ruff reported findings; report-only until RUFF_GATE=on (issue #64)"
            exit 0
          fi
          exit "$status"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run tests inside the image build
        run: docker build --target test .
      - name: Build runtime image (not pushed)
        run: docker build --target runtime --tag parking-report-helper:ci .
      - name: Smoke test
        run: |
          docker run --rm parking-report-helper:ci --help
          docker run --rm -v "$PWD:/data:ro" parking-report-helper:ci sample.json --city "Example City" | head -n 3
          test "$(docker run --rm --entrypoint id parking-report-helper:ci -u)" != 0
      - name: Build Render HTTP image and smoke-test health without API credentials
        run: |
          docker build -f Dockerfile.render -t parking-http:ci .
          docker run -d --name parking-http -p 127.0.0.1:10000:10000 -e PARKING_HTTP_TOKEN=synthetic-ci-token-0000000000000000 parking-http:ci
          trap 'docker rm -f parking-http' EXIT
          python - <<'PY'
          import json, time, urllib.request
          for attempt in range(20):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:10000/healthz', timeout=2) as response:
                      assert json.load(response)['submission_enabled'] is False
                  break
              except OSError:
                  time.sleep(.5)
          else:
              raise SystemExit('Health smoke failed')
          PY
          test "$(docker exec parking-http id -u)" != 0

  security:
    # Issue #74: bandit (Python SAST beyond CodeQL) and pip-audit (CVEs in the
    # resolved environment, not only declared deps). Measure-only: findings are
    # reported in the job summary; the job fails only when the repo variable
    # SECURITY_GATE=on (planned for December), the same pattern as COVERAGE_GATE.
    name: Security scan (bandit + pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install package and freeze the resolved environment
        run: |
          python -m pip install ".[api]"
          python -m pip freeze --exclude-editable > resolved-requirements.txt
          python -m pip install "bandit>=1.8,<2" "pip-audit>=2.9,<3"
      - name: bandit over src/
        env:
          SECURITY_GATE: ${{ vars.SECURITY_GATE }}
        run: |
          status=0
          bandit -r src -f txt -o bandit.txt || status=$?
          {
            echo "## bandit"
            echo '```'
            sed -n '/^Run metrics/,$p' bandit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ] && [ "$SECURITY_GATE" != "on" ]; then
            echo "::warning::bandit reported findings; measure-only until SECURITY_GATE=on (issue #74)"
            exit 0
          fi
          exit "$status"
      - name: pip-audit of the resolved environment
        env:
          SECURITY_GATE: ${{ vars.SECURITY_GATE }}
        run: |
          status=0
          pip-audit -r resolved-requirements.txt --no-deps --disable-pip \
            --progress-spinner off --desc off -f markdown -o pip-audit.md || status=$?
          { echo "## pip-audit"; cat pip-audit.md; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ] && [ "$SECURITY_GATE" != "on" ]; then
            echo "::warning::pip-audit found known vulnerabilities; measure-only until SECURITY_GATE=on (issue #74)"
            exit 0
          fi
          exit "$status"
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-reports
          path: |
            bandit.txt
            pip-audit.md
          retention-days: 30
