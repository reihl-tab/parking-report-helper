name: Add new items to project

# Issues only. Issue events always run this file from the default branch, so
# no pull request can change the job that receives PROJECT_PAT. There is
# deliberately no pull_request / pull_request_target trigger: a PR reaches the
# board through the issue it references (fixes #N). See CONTRIBUTING.md and
# tests/test_workflow_secret_boundary.py.
on:
  issues:
    types: [opened]

permissions: {}

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: https://github.com/users/reihlinstinct/projects/2
          github-token: ${{ secrets.PROJECT_PAT }}
