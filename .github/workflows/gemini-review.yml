name: Gemini code review

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: 'Review only this pull request number (optional)'
        required: false

# Advisory AI review of open PRs. Deliberately NOT triggered by PR events:
# repository rule #119 (tests/test_workflow_secret_boundary.py) forbids
# repository secrets in workflows a PR can influence, so this polls open
# PRs from the default branch on a schedule instead. Permissions below are
# the whole grant: read the repo, comment on PRs, nothing else.

permissions:
  contents: read
  pull-requests: write

# A manual dispatch must not overlap a scheduled run: both would check
# already-reviewed before either posts and could double-review a head.
concurrency:
  group: gemini-review
  cancel-in-progress: false

jobs:
  gemini-review:
    timeout-minutes: 10
    # Public repositories only: PR diffs are sent to the Gemini API, and
    # private repository content must never leave GitHub. On a private
    # repository this job skips instead of failing.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Advisory Gemini review of open PRs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr }}
        run: python3 tools/gemini_review.py
